
name: Deploy Revision Mate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project
        run: |
          mkdir app
          unzip -q revision-mate-github-ready.zip -d app
          APP_DIR=$(find app -name package.json -print -quit | xargs dirname)
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Install and build
        run: |
          npm install --prefix "$APP_DIR"
          npm pkg set scripts.build="vite build" --prefix "$APP_DIR"
          npm run build --prefix "$APP_DIR"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/revision-mate/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
